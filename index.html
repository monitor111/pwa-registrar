<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PWA Реєстратор</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Манифест PWA -->
  <link rel="manifest" href="manifest.json">

  <!-- Стили -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark text-light">

  <div class="container py-5 text-center">
    <h1 class="mb-4">🚗 PWA Відеореєстратор</h1>

    <video id="preview" autoplay playsinline class="rounded shadow mb-3" width="100%" style="max-width: 600px;"></video>

    <div class="btn-group mt-3">
      <button id="startBtn" class="btn btn-success">▶ Почати запис</button>
      <button id="stopBtn" class="btn btn-danger" disabled>⏹ Зупинити</button>
      <button id="saveBtn" class="btn btn-primary" disabled>💾 Зберегти</button>
      <button id="clearBtn" class="btn btn-warning">🗑 Очистити старі</button>
    </div>

    <div id="status" class="mt-3 text-info"></div>
  </div>

  <!-- Подключаем FFmpeg через jsDelivr (UMD) -->
  <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.11.8/dist/ffmpeg.min.js"></script>

  <!-- Подключаем ваш app.js -->
  <script src="app.js"></script>
</body>
</html>
