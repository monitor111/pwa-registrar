<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PWA Реєстратор</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark text-light">
  <div class="container py-5 text-center">
    <h1 class="mb-4">🚗 PWA Відеореєстратор</h1>
    <video id="preview" autoplay playsinline muted class="rounded shadow mb-3" width="100%" style="max-width: 600px;"></video>
    <div class="btn-group mt-3">
      <button id="startBtn" class="btn btn-success">▶ Почати запис</button>
      <button id="stopBtn" class="btn btn-danger" disabled>⏹ Зупинити</button>
      <button id="saveBtn" class="btn btn-primary" disabled>💾 Зберегти</button>
      <button id="clearBtn" class="btn btn-warning">🗑 Очистити</button>
    </div>
    <div id="status" class="mt-3 text-info"></div>
  </div>
 <script src="https://cdn.jsdelivr.net/npm/mp4-muxer@4.4.0/build/mp4-muxer.min.js"></script>
 <script src="app.js"></script>
</body>
</html>
